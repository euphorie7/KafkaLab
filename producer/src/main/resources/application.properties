# Identite du microservice
spring.application.name=producer


# Adresse du broker Kafka
spring.kafka.bootstrap-servers=localhost:6000
# echouer au demarrage si KafkaAdmin ne peut pas joindre Kafka
spring.kafka.admin.fail-fast=true
# Nombre de retries du client Admin Kafka
#Temps maximal pour attendre la reponse  une requete envoyee au broker
spring.kafka.admin.properties.request.timeout.ms=3000
#Temps maximal pour terminer une operation administrative, retries compri
spring.kafka.admin.properties.default.api.timeout.ms=5000


# Serialisation des key et messages (des string)
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer

auto.create.topics.enable=false

# API
server.port=8081

# Swagger UI
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs


# Fichier de logs
logging.file.name=logs/producer.log


# Format des logs
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss.SSS} [${spring.application.name}] [%thread]  %-5level %logger{36} - %msg%n


# Niveau de journalisation
logging.level.root=INFO
logging.level.lab.producer=DEBUG

# Rotation des fichiers
logging.logback.rollingpolicy.file-name-pattern=logs/producer-%d{yyyy-MM-dd}.%i.log.gz
logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.max-history=30
logging.logback.rollingpolicy.total-size-cap=1GB