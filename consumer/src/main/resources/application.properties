spring.application.name=${APP_NAME:consumer_1}

# Connexion au broker
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:6000}

# Groupe de consommateurs
spring.kafka.consumer.group-id=${CONSUMERS_GROUPE_ID:ResponsabiliteMetier_1}

#Topic
app.kafka.topic=${LISTEN_TOPIC:EvennementMetier_1}

# Offset
spring.kafka.consumer.auto-offset-reset=${CONSUMER_OFFSET_RESET:earliest}



# Deserialisation
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer

#pas de serveur http necessaire maintenant
spring.main.web-application-type=none
# Fichier de logs
logging.file.name=logs/consumer.log


# Format des logs
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss.SSS} [${spring.application.name}] [%thread]  %-5level %logger{36} - %msg%n


# Niveau de journalisation
logging.level.root=INFO
logging.level.lab.consumer=DEBUG

# Rotation des fichiers
logging.logback.rollingpolicy.file-name-pattern=logs/consumer-%d{yyyy-MM-dd}.%i.log.gz
logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.max-history=30
logging.logback.rollingpolicy.total-size-cap=1GB